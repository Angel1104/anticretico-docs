# Angel's approvals, by comment on an issue (author checked against APPROVER_LOGIN):
#   /ui-approved  feature design approved AND business questions answered -> adds ui:approved
#   /approved     a gate of model/new-app.md or the design-system consolidation -> adds approved
# Both remove needs:angel. The Tech Lead / Product agent still checks every question has an answer.
# Note: labels added with GITHUB_TOKEN do not trigger other workflows.
name: approvals
on:
  issue_comment:
    types: [created]
permissions:
  issues: write
jobs:
  approve:
    if: >-
      !github.event.issue.pull_request &&
      github.event.comment.user.login == vars.APPROVER_LOGIN &&
      (startsWith(github.event.comment.body, '/ui-approved') || startsWith(github.event.comment.body, '/approved'))
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          BODY: ${{ github.event.comment.body }}
        run: |
          case "$BODY" in
            /ui-approved*) label=ui:approved ;;
            *) label=approved ;;
          esac
          gh issue edit "$NUMBER" --repo "$REPO" --add-label "$label" --remove-label "needs:angel"
